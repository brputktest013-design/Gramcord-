name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - build-android.sh
      - .github/workflows/apk.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project and key
        run: bash build-android.sh

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk Gramcord.apk

      - name: Save signing key in the repo
        run: |
          if [ -n "$(git status --porcelain gramcord.jks)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add gramcord.jks
            git commit -m "Add signing key"
            git pull --rebase -q || true
            git push || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Gramcord-apk
          path: Gramcord.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "apk-$RUN_NUMBER" Gramcord.apk \
            --title "Gramcord APK #$RUN_NUMBER" \
            --notes "Готовый APK. Скачайте Gramcord.apk ниже и установите на телефон."
